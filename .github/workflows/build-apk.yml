name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      # Adds only what is missing (gradlew, wrapper jar, launcher icons, styles);
      # files committed in this repo are never overwritten.
      - name: Generate missing Android scaffolding
        run: flutter create --platforms=android --org com.lite --project-name liteflow .

      - run: flutter pub get

      # Optional: sign with your own key. Add repo secrets
      # KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
      # Without them the APK is signed with the debug key (still installable).
      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=upload-keystore.jks"
            } > android/key.properties
            echo "Using release keystore"
          else
            echo "No keystore secrets - using debug signing"
          fi

      - name: Build split-per-ABI APKs (small)
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols

      - name: Build universal APK
        run: flutter build apk --release

      - name: Collect APKs
        run: |
          mkdir -p dist
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do cp "$f" "../../../../dist/liteflow-${f#app-}"; done
          cp app-release.apk ../../../../dist/liteflow-universal-release.apk
          ls -lh ../../../../dist

      - uses: actions/upload-artifact@v4
        with:
          name: liteflow-apks
          path: dist/*.apk

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
